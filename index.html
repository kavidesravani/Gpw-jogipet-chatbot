<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>College Chatbot</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #a8edea, #fed6e3);
    background-attachment: fixed;
    padding: 20px;  
    margin: 0;
    text-align: center;
  }

  /* ✅ Logo visible at first */
  #logo {
    width: 180px;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 250px;
  }

  #logo:hover {
    transform: scale(1.1);
  }

  /* ✅ Chatbot hidden at start */
  #chatContainer {
    display: none;
  }

  #chatbox {
    width: 100%;
    max-width: 1800px;
    margin: 30px auto;
    background-color: rgba(255, 255, 255, 0.9);
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
    height: 500px;
    overflow-y: auto;
  }

  .message {
    margin: 10px 0;
    padding: 10px;
    border-radius: 10px;
    line-height: 1.4;
    font-size: 15px;
  }

  .bot { background-color: #d1ffd7; text-align: left; color: #222; white-space: pre-line; }
  .user { background-color: #cce5ff; text-align: right; color: #222; }

  #optionsArea {
    width: 100%;
    max-width: 600px;
    margin: 20px auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  button {
    padding: 12px;
    font-size: 16px;
    background: linear-gradient(135deg, #007bff, #00c6ff);
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 8px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
  }

  button:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 12px rgba(0,0,0,0.2);
  }

  #clearButton {
    grid-column: span 2;
    background: linear-gradient(135deg, #ff4b1f, #ff9068);
  }

  h2 {
    color: #333;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
  }

  a {
    color: #007bff;
    text-decoration: none;
    font-weight: bold;
  }

  a:hover {
    text-decoration: underline;
  }
</style>
</head>

<body>

<!-- ✅ ONLY LOGO VISIBLE -->
<img id="logo" src="https://i.postimg.cc/PrXTFr7k/IMG-20251111-WA0002.jpg" alt="Chatbot Logo">

<!-- ✅ CHATBOT HIDDEN INITIALLY -->
<div id="chatContainer">
  <h2>🎓 College Chatbot</h2>

  <div id="chatbox">
    <div class="message bot">
      Hi! I'm your college chatbot. Please choose a category below to learn more.
    </div>
  </div>

  <div id="optionsArea">
    <button onclick="sendOption('about')">About</button>
    <button onclick="sendOption('admission')">Admissions</button>
    <button onclick="sendOption('courses')">Courses</button>
    <button onclick="sendOption('fees')">Fees</button>
    <button onclick="sendOption('labs')">Labs & Activities</button>
    <button onclick="sendOption('placements')">Placements</button>
    <button onclick="sendOption('hostel')">Hostel</button>
    <button onclick="sendOption('scholarship')">Scholarships</button>
    <button onclick="sendOption('any other info')">Any other info</button>
    <button onclick="sendOption('updates')">Updates</button> 

    <!-- ✅ Clear Chat Button -->
    <button id="clearButton" onclick="clearChat()">🧹 Clear Chat</button>
  </div>
</div>

<script>
document.getElementById("logo").onclick = function () {
  document.getElementById("chatContainer").style.display = "block";
  document.getElementById("logo").style.display = "none";  // Hide logo after click
};

function sendOption(option) {
  addMessage(option.toUpperCase(), 'user');
  const reply = getBotReply(option);
  setTimeout(() => addMessage(reply, 'bot'), 300);
}

function addMessage(text, sender) {
  const chatbox = document.getElementById('chatbox');
  const messageDiv = document.createElement('div');
  messageDiv.className = 'message ' + sender;
  messageDiv.innerHTML = text; // ✅ Allows clickable links
  chatbox.appendChild(messageDiv);
  chatbox.scrollTop = chatbox.scrollHeight;
}

/* ✅ Clear Chat Function */
function clearChat() {
  const chatbox = document.getElementById('chatbox');
  chatbox.innerHTML = `
    <div class="message bot">
      Chat cleared! 👋 You can start again by selecting a category below.
    </div>
  `;
}

/* ✅ Bot Replies */
function getBotReply(option) {
  switch(option) {

    case 'about':
      return "✅ About GPW Jogipet:\nGovernment Polytechnic for Women (GPW), Jogipet is a government-run technical institution dedicated to empowering women through quality technical education.\n\nThe college offers diploma programs that combine strong theoretical knowledge with practical, industry-oriented training.\n\nThe institution focuses on discipline, skill development, and overall personality growth.\n\nWith well-equipped laboratories, experienced faculty, and a supportive learning environment, GPW Jogipet prepares students to become confident, skilled, and industry-ready professionals.\n\n✅ Mission of GPW Jogipet\n\nOur mission is:\n• To provide high-quality technical education exclusively for women.\n• To create a safe, supportive, and inclusive learning environment.\n• To equip students with practical skills through advanced laboratories and workshops.\n• To promote industry readiness through training, seminars, and hands-on projects.\n• To empower women to become competent professionals, innovators, and leaders.\n\n✅ Vision of GPW Jogipet\n\nTo be a leading women’s polytechnic recognized for academic excellence, innovation, and skill-based education.";

    case 'admission':
      return "🎓 Admission Details:\n\nAdmissions are open from June to August through the TGPOLYCET Portal.\n\nRequired Documents:\n1. Allotment Order\n2. Joining Report\n3. POLYCET Hall Ticket\n4. Rank Card\n5. Transfer Certificate (Original)\n6. SSC Memo\n7. Study & Bonafide Certificates (4th–10th)\n8. Income Certificate\n9. Caste Certificate\n10. Residence Proof\n11. Aadhaar Card\n12. Six Passport-size Photos\n\nBring the original set with two Xerox copies.";

    case 'courses':
      return "💡 Courses Offered:\n\nOur college offers the following Diploma programs:\n\n✅ Computer Science Engineering (CSE): Focused on software, programming, and networking.\n✅ Electronics & Communication Engineering (ECE): Covers circuits, embedded systems, and communication systems.\n\nEach course includes both theory and practical lab training.";

    case 'fees':
      return "💰 Fee Structure:\n\n• Self-Reporting Fee: ₹1,880\n• Spot Admission Students: Additional ₹5,000\n• Exam Fee per Semester: ₹650\n• Attendance between 65%–75%: ₹650 fine per semester\n\nPayments can be made online or at the college office.";

    case 'scholarship':
      return "🎓 Scholarships:\n\nScholarships are available for eligible students (except spot admission and children of government employees).\n\nMain Schemes:\n• EPASS: ₹1,000 – ₹5,000\n• Pragathi Scheme: For girl students\n• Swanathi Scheme: For SC/ST students\n• Sakshyam Scheme: Up to ₹50,000 per year";

    case 'labs':
      return "🧪 Labs & Activities:\n\nECE Department:\n- Semiconductor & Basic Electronics Lab\n- Microcontroller Lab\n- Digital Electronics Lab\n- Communication & Industrial Electronics Lab\n\nCSE Department:\n- Hardware Lab\n- Programming Lab\n- Software Development Center (SDC)\n\nFirst Year:\n- Physics, Chemistry, Electrical, Drawing, and Computer Fundamentals Labs\n\nActivities include seminars, technical tests, industrial visits, mini projects, and sports events.";

    case 'hostel':
      return "🏠 Hostel Information:\n\nOur college provides a safe and comfortable hostel for girl students.\n\nFee Details:\n- Charged based on the number of days stayed\n- Initial Deposit: ₹5,000\n\nDocuments Required:\n1. Student Aadhaar\n2. Parent Aadhaar\n3. Joining Report\n4. Allotment Order\n5. Bank Details\n6. Passport-size Photos";

    case 'placements':
      return "💼 Placements:\n\nOur college maintains a 90% placement record.\n\nRecruiters include:\n• Coca-Cola\n etc...\n\nWe provide placement training, mock interviews, and resume workshops to prepare students.";

    case 'any other info':
      return "📞 Contact Details:\n\nFor any queries, please contact:\nPhone: 8096907521\nEmail: jogipetwomenpolytechnic@gmail.com\nAddress: Government Polytechnic for Women, Jogipet, Telangana\nOffice Hours: Monday–Saturday, 9:30 AM – 4:30 PM.";

    case 'updates':
      return "📢 For daily updates you can visit our channels:\n\n📱 WhatsApp:<a href='https://whatsapp.com/channel/0029VaAiYJzKGGGEtf4r4o2D/' target='_blank'>https://whatsapp.com/channel/0029VaAiYJzKGGGEtf4r4o2D/</a>\n\n🌐 Official Website: <a href='https://sbtet.telangana.gov.in/' target='_blank'>https://sbtet.telangana.gov.in/</a>.";
    default:
      return "Sorry, I didn’t understand that. Please choose a valid option below.";
  }
}
</script>

</body>
</html>
